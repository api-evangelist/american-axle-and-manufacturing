specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: American Axle and Manufacturing
providerId: american-axle-and-manufacturing
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Automotive
  - Manufacturing
  - Driveline
  - Automotive Supplier
  - EDI
  - Supply Chain
  - Rate Limiting
description: >-
  AAM does not publish public API rate limits. Supplier EDI throughput is governed by the supplier agreement and EDI VAN configuration. Reconcile if AAM publishes public limits.
notes: >-
  American Axle & Manufacturing (now Dauch Corporation) operates supplier-facing EDI and the iSupplier portal rather than a public, priced API. EDI onboarding is mandatory for suppliers but governed by the standard automotive Tier-1 supply agreement, not a public price list. No public rate-limit documentation. Reconcile if AAM publishes a public API.
sources:
  - https://www.aam.com/suppliers/doing-business-with-aam
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Undocumented - bilateral agreement
    scope: contract
    metric: varies
    limit: 'see partner agreement; not publicly documented'
policies:
  - name: Documentation Status
    description: >-
      American Axle and Manufacturing does not publish public per-second or per-minute API rate
      limits. Throughput, concurrency, and burst behavior are governed by the
      relevant partner, supplier, or merchant agreement.
  - name: Backoff Strategy
    description: >-
      Where any HTTP API is exposed, clients should implement exponential
      backoff with jitter and honor any Retry-After header returned on 429
      or 503 responses.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
